name: HoYoLAB Daily Check-in

on:
  schedule:
    # 매일 UTC 21:00 (한국 시간 KST 오전 06:00)에 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Check-in Script
        env:
          HOYOLAB_COOKIES: ${{ secrets.HOYOLAB_COOKIES }}
          HOYOLAB_LANG: ${{ secrets.HOYOLAB_LANG || 'ko-kr' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
