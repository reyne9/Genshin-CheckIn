name: Genshin HoYoLAB Auto Check-in

on:
  schedule:
    # GitHub Actions는 UTC(세계 표준시) 기준입니다. (한국 시간 KST = UTC + 9시간)
    # 아래 기본값 '0 21 * * *'은 매일 UTC 21:00 = 한국 시간(KST) 매일 오전 06:00 실행을 의미합니다.
    # 원하는 시간으로 변경하려면 아래 cron 표현식을 수정하세요. (예: KST 오전 9시 -> '0 0 * * *', 6시간마다 -> '0 */6 * * *')
    - cron: '0 21 * * *'

  # GitHub 웹페이지의 Actions 탭에서 수동으로 즉시 실행 테스트할 수 있게 해줍니다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check-in script
        env:
          HOYOLAB_COOKIES: ${{ secrets.HOYOLAB_COOKIES }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python main.py
